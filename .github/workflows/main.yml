name: SohpetSen APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: ZIP dosyasını bul
        shell: bash
        run: |
          ZIP_FILE=$(find . -type f -name 'SohpetSen_v2.5-1.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "SohpetSen_v2.5-1.zip bulunamadı."
            echo "Bulunan ZIP dosyaları:"
            find . -type f -name '*.zip'
            exit 1
          fi

          echo "ZIP bulundu: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: ZIP dosyasını aç
        run: |
          rm -rf build_project
          mkdir -p build_project
          unzip -o "$ZIP_FILE" -d build_project

      - name: Gradle kurulumu
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Projeyi kontrol et
        run: |
          echo "Android proje dosyaları:"
          find build_project -maxdepth 3 -type f \
            \( -name 'build.gradle*' -o -name 'settings.gradle*' -o -name 'gradlew' \) \
            -print

      - name: APK oluştur
        working-directory: build_project
        run: |
          gradle assembleDebug --stacktrace

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: SohpetSen-APK
          path: build_project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
