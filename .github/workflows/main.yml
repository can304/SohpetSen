      - name: Gradle dosyalarını bul
        run: |
          GRADLEW=$(find build_project -type f -name "gradlew" | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew bulunamadı."
            echo "Gradle dosyaları:"
            find build_project -maxdepth 4 -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "gradlew" \)
            exit 1
          fi

          echo "Bulunan Gradle: $GRADLEW"
          chmod +x "$GRADLEW"

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: APK oluştur
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --stacktrace

      - name: APK dosyasını bul
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK oluşturulamadı."
            exit 1
          fi

          echo "Bulunan APK: $APK"
          cp "$APK" "$GITHUB_WORKSPACE/SohpetSen.apk"

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: SohpetSen-APK
          path: SohpetSen.apk
